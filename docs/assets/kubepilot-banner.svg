<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" width="100%" height="230" role="img" aria-label="KubePilot — Deterministic GenAI Root-Cause Diagnosis, FinOps &amp; DevSecOps for Kubernetes">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(148,163,184,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="1100" height="230" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1100" height="230" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="1100" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Decorative Glows -->
  <circle cx="115" cy="115" r="78" fill="#38bdf8" opacity="0.08"/>
  <circle cx="960" cy="115" r="95" fill="#6366f1" opacity="0.07"/>

  <!-- KubePilot Heptagon + Helm + Signal Pulse Logo -->
  <g transform="translate(115, 115)">
    <!-- Outer Kubernetes-inspired Heptagon Ring -->
    <polygon points="0,-66 51.6,-41.1 64.3,14.7 28.6,59.5 -28.6,59.5 -64.3,14.7 -51.6,-41.1"
             fill="#0b1324" stroke="url(#wheelGrad)" stroke-width="3.2"/>
    <!-- Inner Radar Circle -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.5"/>
    <!-- Helm Spokes -->
    <line x1="0" y1="-56" x2="0" y2="-24" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="-35" x2="19" y2="-15" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="54" y1="12" x2="23" y2="5" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="50" x2="10" y2="21" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-24" y1="50" x2="-10" y2="21" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-54" y1="12" x2="-23" y2="5" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-44" y1="-35" x2="-19" y2="-15" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Center Trace Pulse Waveform -->
    <polyline points="-30,4 -14,4 -7,-16 3,18 11,-8 18,4 30,4"
              fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="3" cy="18" r="4" fill="#f43f5e"/>
  </g>

  <!-- Title & Tagline -->
  <g transform="translate(215, 66)">
    <text x="0" y="0" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">
      KubePilot
    </text>
    <rect x="192" y="-26" width="68" height="24" rx="12" fill="rgba(56,189,248,0.14)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="226" y="-10" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">v0.2.1</text>

    <text x="0" y="34" fill="#cbd5e1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
      Deterministic Root-Cause Diagnosis, Operational FinOps &amp; DevSecOps for Slow GenAI on Kubernetes
    </text>
    <text x="0" y="60" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      OTel gen_ai.* Traces  ×  Prometheus (CFS / Linux PSI / llama.cpp)  ×  K8s Events &amp; Pods  ×  OpenCost FinOps
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 82)">
      <rect x="0" y="0" width="168" height="28" rx="6" fill="#111c33" stroke="#1e293b"/>
      <circle cx="14" cy="14" r="4" fill="#10b981"/>
      <text x="26" y="18" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">0 LLM Hallucinations</text>

      <rect x="178" y="0" width="156" height="28" rx="6" fill="#111c33" stroke="#1e293b"/>
      <circle cx="192" cy="14" r="4" fill="#38bdf8"/>
      <text x="204" y="18" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">&lt; 0.5s Triage Time</text>

      <rect x="344" y="0" width="190" height="28" rx="6" fill="#111c33" stroke="#1e293b"/>
      <circle cx="358" cy="14" r="4" fill="#a855f7"/>
      <text x="370" y="18" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">Read-Only · PSS-Restricted</text>

      <rect x="544" y="0" width="174" height="28" rx="6" fill="#111c33" stroke="#1e293b"/>
      <circle cx="558" cy="14" r="4" fill="#f59e0b"/>
      <text x="570" y="18" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">24/24 Recall · 0/21 FP</text>

      <rect x="728" y="0" width="132" height="28" rx="6" fill="#111c33" stroke="#1e293b"/>
      <circle cx="742" cy="14" r="4" fill="#38bdf8"/>
      <text x="754" y="18" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">Go 1.26 · 0 Deps</text>
    </g>
  </g>
</svg>
