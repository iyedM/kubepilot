name: Release Binaries & Container Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Multi-Arch Binaries & Krew Archives
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go 1.26.0
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.26.0"
          cache: true

      - name: Run unit tests & preregistration integrity check
        run: |
          make test
          ./bin/eval-score --runs eval/runs/test --catalog eval/faults/catalog.v1.json

      - name: Cross-compile release archives (linux & darwin, amd64 & arm64)
        run: |
          mkdir -p dist
          for pair in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $pair
            GOOS="$1"
            GOARCH="$2"
            STAGE="dist/kubepilot_${GOOS}_${GOARCH}"
            mkdir -p "${STAGE}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${STAGE}/why-slow" ./cmd/why-slow
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${STAGE}/kubectl-why_slow" ./cmd/why-slow
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${STAGE}/kubepilot-server" ./cmd/kubepilot-server
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${STAGE}/eval-score" ./cmd/eval-score
            cp LICENSE README.md "${STAGE}/"
            tar -C "${STAGE}" -czf "dist/why-slow_${GOOS}_${GOARCH}.tar.gz" why-slow kubectl-why_slow kubepilot-server eval-score LICENSE README.md
            rm -rf "${STAGE}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "${TAG}" dist/*.tar.gz dist/SHA256SUMS \
            --title "KubePilot ${TAG}" \
            --notes "Deterministic, strictly read-only Kubernetes root-cause diagnosis for slow or failing GenAI workloads (24/24 = 100% held-out test recall, 0/21 false positives)."

  publish-image:
    name: Build & Push Container Image (GHCR)
    runs-on: ubuntu-24.04
    needs: build-binaries
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image (and push on tag)
        run: |
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          fi
          docker build -t "${IMAGE_REPO}:${TAG}" -t "${IMAGE_REPO}:latest" .
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker push "${IMAGE_REPO}:${TAG}"
            docker push "${IMAGE_REPO}:latest"
          fi
