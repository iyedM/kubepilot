# llama.cpp server serving the pinned GGUF model over an OpenAI-compatible
# API. Template rendered by lab/scripts/lab-up.sh with envsubst, substituting
# only ${LLAMACPP_IMAGE} and ${MODEL_FILE}.
apiVersion: v1
kind: Namespace
metadata:
  name: genai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: genai
  labels:
    app.kubernetes.io/name: model-server
spec:
  replicas: 1
  # Recreate, as is common for a single-instance model server that cannot
  # hold two copies of the model at once: the old pod is stopped before the
  # new one starts. With RollingUpdate a broken rollout (unschedulable pod,
  # failing readiness, slow cold start) would never take the old pod down,
  # so those faults would have no user impact. Consequence: any change applied
  # by `make lab-up` to this Deployment causes a short model outage.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: model-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-server
    spec:
      # The image runs as root by default (no USER in the image); it works
      # unprivileged, so we force a non-root user here.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-server
          image: ${LLAMACPP_IMAGE}
          args:
            - -m
            - /models/${MODEL_FILE}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            # Prometheus metrics on /metrics (llamacpp:* series).
            - --metrics
            - -c
            - "2048"
            # Match the CPU limit: more threads than CPUs only adds throttling.
            - --threads
            - "2"
            # One request at a time: stable, comparable latencies.
            - --parallel
            - "1"
            - --alias
            - qwen2.5-0.5b-instruct
          ports:
            - name: http
              containerPort: 8080
          resources:
            # request == limit for CPU: the CFS quota makes throttling visible
            # in cAdvisor, which the cpu-throttle fault will rely on.
            requests:
              cpu: "2"
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          # /health answers 503 while the model is loading, 200 once ready.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        # /models on the kind node is the host's .tools/models (extraMounts).
        - name: models
          hostPath:
            path: /models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: genai
  labels:
    app.kubernetes.io/name: model-server
  annotations:
    # Picked up by the chart's kubernetes-service-endpoints scrape job.
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
spec:
  selector:
    app.kubernetes.io/name: model-server
  ports:
    - name: http
      port: 8080
      targetPort: http
